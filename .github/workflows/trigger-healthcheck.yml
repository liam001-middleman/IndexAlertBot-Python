name: Trigger Healthcheck

# 外部觸發器（cron-job.org）斷線哨兵。
#
# 三個 alerts workflow 實際上靠 cron-job.org 以 workflow_dispatch 外部觸發；
# GitHub 原生 schedule 極不穩定（`*/5` 一天僅 7~11 次），不能當備援。
# 若 cron-job.org 的 PAT 過期（最常見）或 job 被停用，dispatch 會靜默停止、
# 不會有任何錯誤訊息。本 workflow 以原生排程每 20 分鐘醒來，**逐一**檢查三個
# alerts workflow 最近的 workflow_dispatch 紀錄（只查全 repo 總表會被 24/7 的
# crypto 蓋掉 US／TW 的斷線），並在各自活躍時段內發現靜默就發 Telegram 告警、
# 指名是哪一個 workflow 掛掉，同時讓 workflow 變紅。
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 讀取 Actions 執行紀錄（GET /repos/{owner}/{repo}/actions/runs）

concurrency:
  group: trigger-healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check external trigger health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          # 活躍時段內超過此分鐘數沒有 workflow_dispatch 即視為斷線。
          # 寬容期（CRONJOB_GRACE_MINUTES）預設等於此值，避免時段一開始誤報。
          # 只想檢查特定 workflow 時可設定 HEALTHCHECK_WORKFLOWS（逗號分隔檔名）。
          CRONJOB_MAX_SILENCE_MINUTES: '30'
          TZ: 'Asia/Taipei'
        run: python healthcheck.py
