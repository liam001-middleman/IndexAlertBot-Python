name: Secret Scan

# 金鑰外洩防線：用 gitleaks 掃描「全部 git 歷史」，抓到疑似金鑰就讓 CI 失敗。
# 觸發時機刻意排除 alert_state_*.json 的變更 —— 那些檔案每 5 分鐘就被 bot commit 一次，
# 不排除的話這個掃描會被排程洗版（每週排程不受 paths-ignore 影響，仍會全歷史複掃）。
on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'alert_state_*.json'
  pull_request:
    paths-ignore:
      - 'alert_state_*.json'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# 最小權限：只讀取程式碼
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 版本與 sha256 一起鎖定（雜湊取自官方 checksums.txt），避免上游被替換
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # 需要完整歷史才能掃描所有 commit

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: |
          if gitleaks git . --config .gitleaks.toml --log-opts="--all" \
               --redact --no-banner --verbose; then
            echo "::notice::gitleaks 未發現可疑金鑰"
          else
            echo "::error::gitleaks 發現疑似金鑰！請先到發行平台撤銷/輪替金鑰，再清理 git 歷史（詳見 README「金鑰安全」），只刪檔案是沒有用的。"
            exit 1
          fi
