name: Alerts - Crypto

on:
  schedule:
    # 加密貨幣 24 小時，每 5 分鐘（UTC）
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-alert-bot-crypto
  cancel-in-progress: false

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Run alert bot (crypto)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: 'Asia/Taipei'
        run: python main.py --market crypto --state alert_state_crypto.json

      - name: Commit alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state_crypto.json
          if git diff --cached --quiet; then
            echo "::notice::alert_state 沒有變更，跳過 commit"
            exit 0
          fi
          git commit -m "chore: update crypto alert state $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            echo "同步遠端並推送（第 $i 次嘗試）..."
            if git pull --rebase origin master && git push origin master; then
              echo "::notice::alert_state 已 commit 並推送"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" -lt 5 ]; then
              sleep 3
            fi
          done
          echo "::error::多次嘗試後仍無法推送 alert_state，留待下個排程重試"
          exit 1
