# ============================================================
# IndexAlertBot 設定檔
# 標的、警報門檻、歷史資料期間、DeepSeek / Telegram 設定
# 機密（API Key / Token / Chat ID）請放在環境變數，不要寫在這裡
# ============================================================

# 追蹤標的（market 只能是 us / tw / crypto；總體經濟資產見下方 macro.price_symbols）：
#   provider: yahoo（預設）→ symbol 需為 Yahoo Finance 代號
#     美股：AAPL、TSLA；台股：2330.TW、2317.TW；加密貨幣：BTC-USD、ETH-USD
#   provider: max → symbol 為 MAX 交易所交易對（加密貨幣台幣報價，免金鑰）
#     加密貨幣：btctwd、ethtwd、usdttwd
assets:
  - symbol: "AAPL"
    name: "蘋果"
    market: "us"
  - symbol: "TSLA"
    name: "特斯拉"
    market: "us"
  - symbol: "SPCX"
    name: "SPECX"
    market: "us"
  - symbol: "NVDA"
    name: "輝達"
    market: "us"
  - symbol: "KLAC"
    name: "科磊"
    market: "us"
  - symbol: "MU"
    name: "美光"
    market: "us"
  - symbol: "ORCL"
    name: "甲骨文"
    market: "us"
  - symbol: "NOK"
    name: "諾基亞"
    market: "us"
  - symbol: "2330.TW"
    name: "台積電"
    market: "tw"
  - symbol: "2317.TW"
    name: "鴻海"
    market: "tw"
  - symbol: "2327.TW"
    name: "國巨"
    market: "tw"
  - symbol: "6789.TW"
    name: "采鈺"
    market: "tw"
  - symbol: "00919.TW"
    name: "群益台灣精選高息"
    market: "tw"
  - symbol: "00878.TW"
    name: "國泰永續高股息"
    market: "tw"
  - symbol: "00918.TW"
    name: "大華優利高填息30"
    market: "tw"
  - symbol: "00929.TW"
    name: "復華台灣科技優息"
    market: "tw"
  - symbol: "btctwd"
    name: "比特幣"
    market: "crypto"
    provider: "yahoo"
    source_symbol: "BTC-USD"
    convert_to_twd: true
  - symbol: "ethtwd"
    name: "以太幣"
    market: "crypto"
    provider: "yahoo"
    source_symbol: "ETH-USD"
    convert_to_twd: true

# 註：總體經濟資產（美 10 年期殖利率 / 美元指數 / WTI 原油 / 黃金 / VIX）
# 不是「追蹤標的」，它們只是總體層的資料來源，設定在下方 macro.price_symbols；
# 因此不會出現在報告的標的清單，也不會產生個股式的技術面警報。

# 警報門檻：defaults 為所有市場的預設值
# overrides 可依 market（us / tw / crypto）覆寫
alerts:
  defaults:
    rsi_period: 14
    rsi_overbought: 70        # RSI >= 70 視為超買
    rsi_oversold: 30          # RSI <= 30 視為超賣
    intraday_change_pct: 5.0  # 日內對比前收漲跌幅門檻（%）
    ma_deviation_pct: 5.0     # 乖離 MA 門檻（%）
    ma_periods: [20, 60, 200] # 要計算與監控的均線週期
  overrides:
    us:
      ma_deviation_pct: 3.0  # US MA deviation threshold 3% (test)
    crypto:
      intraday_change_pct: 5.0   # crypto: same as default threshold
      ma_deviation_pct: 5.0      # crypto: same as default threshold
    tw:
      intraday_change_pct: 6.0

# 抓取的歷史資料期間（供 RSI / MA 計算）
history:
  period: "2y"      # yfinance 支援的期間字串
  interval: "1d"    # 日線

# DeepSeek API（api_key 從環境變數 DEEPSEEK_API_KEY 讀取）
deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

# Telegram（token / chat_id 從環境變數讀取）
# parse_mode 留空 = 純文字；若要富文字可設 "HTML"
telegram:
  parse_mode: ""

# 報告輸出
#   style: intuitive = 白話三段式（預設，給不想看指標的人）
#          technical = 指標報表（原始格式，方便逐項核對數值）
#   include_raw_appendix: 報告末端附上「程式產生」的原始數據區塊（數字不經 AI，保證正確）
report:
  style: "intuitive"
  include_raw_appendix: true
  max_chars: 1800          # 只寫進 prompt 當長度指引（Telegram 單則上限由 notifier 處理）

# 總體經濟指標（Macro 層）
#   BLS  ：物價（CPI／核心 CPI）與就業（非農／失業率／時薪），免金鑰
#   FRED ：PCE／核心 PCE／政策利率／通膨預期，需環境變數 FRED_API_KEY（未設定則自動略過）
#   Fed  ：FOMC 聲明與官員談話 RSS，免金鑰
macro:
  enabled: true
  cache_file: "macro_snapshot.json"
  # 總體價格要抓的 Yahoo 代號（只是資料來源，不是追蹤標的；留空 = 用 src/macro.py 預設清單）
  # 這些代號不會出現在報告的標的清單，也不會產生個股式技術面警報
  price_symbols:
    - "^TNX"        # 美 10 年期殖利率（FRED 未設定時的備援；市場段落會跳過重複項）
    - "DX-Y.NYB"    # 美元指數
    - "CL=F"        # WTI 原油
    - "GC=F"        # 黃金
    - "^VIX"        # VIX 恐慌指數
  monthly_ttl_hours: 24     # 月度統計（BLS / FRED）快取有效期（小時）
  market_ttl_hours: 1       # 市場價格與 Fed RSS 快取有效期（小時）
  bls_series:
    cpi: "CUUR0000SA0"               # CPI-U 全項目（未季調）
    core_cpi: "CUUR0000SA0L1E"       # 核心 CPI
    nfp: "CES0000000001"             # 非農就業總人數（季調）
    unemployment_rate: "LNS14000000" # 失業率（季調）
    avg_hourly_earnings: "CES0500000003"  # 平均時薪（季調）
  fred_series:
    pce: "PCEPI"
    core_pce: "PCEPILFE"
    fed_funds_upper: "DFEDTARU"
    fed_funds_lower: "DFEDTARL"
    dgs10: "DGS10"
    inflation_expect_10y: "T10YIE"
    inflation_expect_1y: "EXPINF1YR"
  thresholds:
    cpi_yoy_high: 3.0         # CPI 年增率示警門檻（%）
    core_cpi_yoy_high: 3.0    # 核心 CPI 年增率示警門檻（%）
    cpi_mom_accel_pp: 0.2     # 月增率比前月加速幾個百分點才示警
    pce_yoy_high: 2.5         # PCE 年增率示警門檻（%）
    us10y_bp_20d: 40.0        # 10Y 殖利率 20 日變動（bp）
    dxy_pct_20d: 2.0          # 美元指數 20 日漲跌幅（%）
    wti_pct_20d: 10.0         # WTI 原油 20 日漲跌幅（%）
    unrate_jump_pp: 0.3       # 失業率 3 個月內上升幅度（百分點）
    wage_yoy_high: 4.0        # 平均時薪年增率示警門檻（%）
    correlation_min_abs: 0.3  # |r| 低於此值不得聲稱「背離」
  correlation_windows: [20, 60]
  news_keywords:
    - "Fed"
    - "FOMC"
    - "inflation"
    - "CPI"
    - "PCE"
    - "rate cut"
    - "rate hike"
    - "tariff"
    - "recession"
    - "利率"
    - "通膨"
    - "關稅"
    - "降息"
    - "升息"
  risk_weights:
    technical: 0.6            # 風險分數 = 0.6×技術面 + 0.4×總體面（未經回測，僅相對排序參考）
    macro: 0.4

